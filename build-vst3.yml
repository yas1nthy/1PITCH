name: Build 1PITCH VST3

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
  pull_request:

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows x64 VST3
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S . -B build -A x64

      - name: Build VST3
        run: cmake --build build --config Release --target OnePitch_VST3 --parallel

      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: 1PITCH-Windows-x64-VST3
          path: |
            build/OnePitch_artefacts/Release/VST3/1PITCH.vst3/**
            build/OnePitch_artefacts/Release/VST3/1PITCH.vst3
          if-no-files-found: error
          retention-days: 30
